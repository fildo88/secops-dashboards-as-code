name: "SecOps Dashboards As Code"

on:
  # 1. Scheduled background sync (SecOps UI -> GitHub)
  # Runs every 6 hours (00:05, 06:05, 12:05, 18:05 UTC)
  schedule:
    - cron: "5 */6 * * *"

  # 2. Direct push to main by a user (GitHub -> SecOps apply)
  push:
    branches:
      - main
    paths:
      - "dashboards/**"
      - "script/**"
      - ".github/workflows/secops.yaml"

  # 3. Pull Request lifecycle (GitHub -> SecOps plan on PR, apply on merge)
  pull_request:
    branches:
      - main
    types:
      - closed
      - opened
      - synchronize

  # 4. On-demand manual run from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run (download: SecOps->GitHub, plan: diff check, apply: GitHub->SecOps)"
        required: true
        default: "download"
        type: choice
        options:
          - download
          - plan
          - apply

env:
  SECOPS_CUSTOMER_ID: "8a9bcdd8-288f-488c-b433-3fb2f1794b21"
  SECOPS_PROJECT_ID: "secops-lab-lowe-01"
  SECOPS_REGION: "asia-southeast1"
  WIF_PROVIDER: "projects/383339244683/locations/global/workloadIdentityPools/github-actions-google-secops-1/providers/thdac"

jobs:
  secops-dashboards:
    # Prevent infinite loop when github-actions[bot] pushes downloaded dashboards to main
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule'
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: gcp-auth
        name: Authenticate to Google Cloud (Direct WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.SECOPS_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER || env.WIF_PROVIDER }}
          access_token_lifetime: 900s
          export_environment_variables: true
          create_credentials_file: true
          cleanup_credentials: true

      - id: install-python
        name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - id: install-dependencies
        name: Install Dependencies
        run: pip install -r ./requirements.txt

      # Direction A: SecOps -> GitHub (Scheduled cron or manual 'download')
      - id: download-dashboards
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.command == 'download')
        name: Pull Latest Custom Dashboards from SecOps (SecOps -> GitHub)
        env:
          PYTHONPATH: ${{ github.workspace }}/script
        run: |
          python script/main.py download --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboards/
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "chore: pull latest custom dashboards from Google SecOps"
            git push origin main
          else
            echo "No dashboard changes in SecOps to commit."
          fi

      # Direction B1: GitHub -> SecOps Dry-Run Plan (Open PR or manual 'plan')
      - id: plan-dashboards
        if: (github.event_name == 'pull_request' && github.event.pull_request.merged != true) || (github.event_name == 'workflow_dispatch' && inputs.command == 'plan')
        name: Plan Dashboards (GitHub -> SecOps Diff)
        env:
          PYTHONPATH: ${{ github.workspace }}/script
        continue-on-error: true
        run: python script/main.py plan

      # Direction B2: GitHub -> SecOps Apply (Merged PR, human push to main, or manual 'apply')
      - id: apply-dashboards
        if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'push' && github.actor != 'github-actions[bot]') || (github.event_name == 'workflow_dispatch' && inputs.command == 'apply')
        name: Apply Dashboards (GitHub -> SecOps Deploy)
        env:
          PYTHONPATH: ${{ github.workspace }}/script
        continue-on-error: true
        run: python script/main.py apply

      - id: pr-comment
        name: Post comment to Pull Request
        continue-on-error: true
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && (steps.plan-dashboards.outcome == 'success' || steps.apply-dashboards.outcome == 'success')
        with:
          script: |
            const raw = ${{ toJSON(steps.plan-dashboards.outputs.pr_comment_data || steps.apply-dashboards.outputs.pr_comment_data) }};
            const data = JSON.parse(raw);
            const commentBody = `## ${data.title}\n${data.summary}\n<details><summary>Show Details</summary>\n\n${data.details}\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

      - id: check-plan
        name: Check plan failure
        if: ((github.event_name == 'pull_request' && github.event.pull_request.merged != true) || (github.event_name == 'workflow_dispatch' && inputs.command == 'plan')) && steps.plan-dashboards.outcome != 'success'
        run: exit 1

      - id: check-apply
        name: Check apply failure
        if: ((github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'push' && github.actor != 'github-actions[bot]') || (github.event_name == 'workflow_dispatch' && inputs.command == 'apply')) && steps.apply-dashboards.outcome != 'success'
        run: exit 1
